# =============================================================
# Speed Database Configuration
# =============================================================
# All data sources, cities, and known cameras are defined here.
# To update: edit this file, then run:
#   python tools/prepare_speed_db.py --region au
#   python tools/prepare_speed_db.py --region cn
# =============================================================

version: 2
last_updated: "2026-05-13"

# Overpass API endpoint
overpass_api: "https://overpass-api.de/api/interpreter"

# Grid resolution for spatial indexing (must match speed_db.py)
grid_resolution: 0.005

# Rate limit between Overpass requests (seconds)
overpass_delay: 3

# Road types queried from OSM (Overpass highway filter)
osm_road_types:
  - motorway
  - motorway_link
  - trunk
  - trunk_link
  - primary
  - primary_link
  - secondary
  - secondary_link

# Sampling interval for linestring -> point conversion (meters)
sample_interval_m: 30

# ---------------------------------------------------------------------------
# Regions
# ---------------------------------------------------------------------------
regions:
  au:
    description: "Australia"
    output_suffix: ""  # speed_zones.db, speed_cameras.db
    overpass_camera_query: |
      [out:json][timeout:120];
      area["name"="Australia"]["admin_level"="2"]->.au;
      (
        node["highway"="speed_camera"](area.au);
        node["enforcement"="maxspeed"](area.au);
        node["man_made"="surveillance"]["surveillance:type"="camera"]["surveillance:zone"="traffic"](area.au);
      );
      out body;

    # Metro bounding boxes: [south, west, north, east]
    # Split large metros into sub-tiles to avoid Overpass timeouts.
    cities:
      # Brisbane metro - 4 quadrants
      Brisbane_NW: [-27.45, 152.90, -27.30, 153.05]
      Brisbane_NE: [-27.45, 153.05, -27.30, 153.20]
      Brisbane_SW: [-27.55, 152.95, -27.45, 153.10]
      Brisbane_SE: [-27.55, 153.05, -27.45, 153.20]
      # Sydney metro - key corridors
      Sydney_CBD:  [-33.90, 151.15, -33.82, 151.25]
      Sydney_W:    [-33.90, 151.00, -33.80, 151.15]
      Sydney_N:    [-33.82, 151.15, -33.72, 151.28]
      Sydney_S:    [-33.98, 151.10, -33.90, 151.25]
      # Melbourne metro
      Melbourne_CBD: [-37.84, 144.92, -37.78, 145.02]
      Melbourne_E:   [-37.84, 145.02, -37.76, 145.15]
      Melbourne_W:   [-37.84, 144.80, -37.76, 144.92]
      Melbourne_N:   [-37.78, 144.92, -37.70, 145.08]
      # Perth
      Perth_CBD:   [-31.98, 115.82, -31.92, 115.90]
      # Adelaide
      Adelaide_CBD: [-34.96, 138.56, -34.88, 138.64]
      # Canberra
      Canberra:    [-35.35, 149.08, -35.25, 149.18]
      # Gold Coast
      Gold_Coast:  [-28.10, 153.38, -28.00, 153.48]

    # Government data sources (optional, higher quality than OSM)
    government_sources:
      vic_geojson:
        url: "https://opendata.transport.vic.gov.au/dataset/975b80b9-e530-46e2-80a5-54002765e81a/resource/91313d09-a353-4e4a-bca0-d137113790c8/download/speed_zones_march_2026.geojson"
        license: "CC BY 4.0"
        description: "VIC speed zones - March 2026 (Department of Transport and Planning)"

    # Known cameras from government/public sources
    # Fields: lat, lon, speed, type (fixed/red_light/mobile/average/point_to_point), source
    known_cameras:
      # VIC - cameras.vic.gov.au
      - {lat: -37.8136, lon: 144.9631, speed: 60, type: fixed, source: "cameras.vic.gov.au, Melbourne CBD"}
      - {lat: -37.7749, lon: 144.8443, speed: 80, type: fixed, source: "cameras.vic.gov.au, Western Ring Road"}
      - {lat: -37.8197, lon: 145.0568, speed: 60, type: point_to_point, source: "cameras.vic.gov.au, Hoddle St / Eastern Fwy"}
      - {lat: -37.6567, lon: 144.9450, speed: 80, type: fixed, source: "cameras.vic.gov.au, Hume Fwy Craigieburn"}
      - {lat: -38.1485, lon: 144.3614, speed: 60, type: point_to_point, source: "cameras.vic.gov.au, Geelong"}
      # NSW - TfNSW
      - {lat: -33.8688, lon: 151.2093, speed: 50, type: fixed, source: "TfNSW, Sydney CBD"}
      - {lat: -33.8914, lon: 151.2764, speed: 60, type: fixed, source: "TfNSW, Eastern Distributor"}
      - {lat: -33.7966, lon: 151.1805, speed: 60, type: fixed, source: "TfNSW, Pacific Hwy Chatswood"}
      - {lat: -33.9425, lon: 151.2230, speed: 60, type: point_to_point, source: "TfNSW, King St Newtown"}
      - {lat: -33.8568, lon: 151.0382, speed: 80, type: fixed, source: "TfNSW, M4 Motorway"}
      # QLD - mobile zones (approximate)
      - {lat: -27.4698, lon: 153.0251, speed: 60, type: mobile, source: "QLD Police, Brisbane CBD"}
      - {lat: -27.3812, lon: 153.0286, speed: 80, type: mobile, source: "QLD Police, Gateway Motorway"}
      - {lat: -27.5613, lon: 153.0820, speed: 60, type: mobile, source: "QLD Police, Logan Motorway"}

  cn:
    description: "China (Xi'an + Shanghai)"
    output_suffix: "_cn"  # speed_zones_cn.db, speed_cameras_cn.db

    # Per-city group codes stamped on each emitted SpeedSegment's
    # `state` field so the cross-verify summary groups XIA/SHA/...
    # rows distinctly. The fetcher resolves a tile name (key of
    # `cities` below) to its code by longest-prefix match: the
    # longest entry here that the tile name starts with wins.
    # Adding a new city = one new line in `cities` + (if grouping
    # differently) one new line here.
    city_codes:
      "Xi'an":     XIA
      "Shanghai":  SHA
      "Beijing":   BJI
      "Guangzhou": GZH
      "Shenzhen":  SZX
      "Chengdu":   CTU
      "Hangzhou":  HGH

    overpass_camera_query: |
      [out:json][timeout:120];
      (
        node["highway"="speed_camera"](34.10,108.80,34.40,109.15);
        node["enforcement"="maxspeed"](34.10,108.80,34.40,109.15);
        node["highway"="speed_camera"](31.00,121.20,31.45,121.60);
        node["enforcement"="maxspeed"](31.00,121.20,31.45,121.60);
        node["man_made"="surveillance"]["surveillance:type"="camera"]["surveillance:zone"="traffic"](34.10,108.80,34.40,109.15);
        node["man_made"="surveillance"]["surveillance:type"="camera"]["surveillance:zone"="traffic"](31.00,121.20,31.45,121.60);
      );
      out body;

    cities:
      # Xi'an (center ~34.26N, 108.94E)
      Xi'an_CBD: [34.22, 108.88, 34.30, 109.00]
      Xi'an_N:   [34.30, 108.88, 34.38, 109.00]
      Xi'an_S:   [34.15, 108.88, 34.22, 109.00]
      # Shanghai (center ~31.23N, 121.47E)
      Shanghai_CBD: [31.18, 121.40, 31.28, 121.52]
      Shanghai_N:   [31.28, 121.38, 31.38, 121.52]
      Shanghai_W:   [31.18, 121.28, 31.28, 121.40]
      Shanghai_S:   [31.08, 121.40, 31.18, 121.55]

    government_sources: {}

