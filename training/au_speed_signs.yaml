# YOLOv5 Dataset Config -- Australian Speed Signs + Speed Camera
# 9 classes for Luckfox Pico Ultra (RV1106G3) deployment
#
# Usage: python train.py --data au_speed_signs.yaml --cfg yolov5n.yaml --img 320

# Dataset paths (relative to yolov5 repo root, or absolute)
# These will be set by prepare_dataset.py
train: ../au_speed_dataset/train/images
val: ../au_speed_dataset/valid/images
test: ../au_speed_dataset/test/images

# Number of classes
nc: 9

# Class names -- must match postprocess.c class_names[] order
names:
  0: speed_sign_30
  1: speed_sign_40
  2: speed_sign_50
  3: speed_sign_60
  4: speed_sign_70
  5: speed_sign_80
  6: speed_sign_100
  7: speed_sign_110
  8: speed_camera
