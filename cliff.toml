# git-cliff configuration for AI-HUD
#
# Drives the changelog body that ships in every GitHub Release. Groups commits
# by conventional-commit type, hides bot/chore noise, and links each entry to
# the underlying commit on GitHub.
#
# Used by `.github/workflows/release.yml` -- runs whenever a tag matching
# v*.*.* is pushed. Render locally with:
#     git-cliff --config cliff.toml --latest

[changelog]
# Header rendered once at the top of the release body. The {{release}} blocks
# below produce one section per tag (in the release pipeline we ask for
# --latest so only the new tag's section is emitted).
header = """
## AI-HUD Release Notes
"""

# Per-release body template (Tera syntax). For each tag we emit a header line,
# then one ### section per commit group, then a footer summarizing the diff.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/danielzhangau/ai-hud/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

# Footer rendered once at the bottom.
footer = """
<!-- generated by git-cliff -->
"""

# Strip the leading/trailing whitespace inside the templates above.
trim = true

[git]
# Stick strictly to the Conventional Commits spec; commits that don't match
# either flow into "Miscellaneous Tasks" (if matched by group below) or get
# filtered out entirely.
conventional_commits = true
filter_unconventional = true
# Process commits in the order git logs them (newest first within the range).
split_commits = false

# Pre-process commit messages before grouping. Useful for stripping noise like
# "[skip ci]" or normalizing scope casing, but we don't need anything yet.
commit_preprocessors = []

# Group rules. The first matching rule wins. Order = display order in changelog.
commit_parsers = [
    { message = "^feat",      group = "🚀 Features" },
    { message = "^fix",       group = "🐛 Bug Fixes" },
    { message = "^perf",      group = "⚡ Performance" },
    { message = "^refactor",  group = "♻️  Refactor" },
    { message = "^docs",      group = "📚 Documentation" },
    { message = "^test",      group = "🧪 Tests" },
    { message = "^build",     group = "📦 Build System" },
    { message = "^ci",        group = "🤖 CI / CD" },
    { message = "^chore",     group = "🧹 Chores" },
    # Anything else (style, revert, ...) is skipped from the release body.
    { message = ".*",         skip = true },
]

# Don't emit a release entry for commits matching these (security: never leak
# WIP secrets accidentally tagged).
filter_commits = false
# Tags must start with "v" -- protects against accidental triggers from
# date-based or stage tags like "prod-2026-03-15".
tag_pattern = "v[0-9].*"

# Skip releases with no notable commits (avoids empty changelogs).
skip_tags = ""
ignore_tags = ""

# Sort newest commits first within each section.
topo_order = false
sort_commits = "newest"
