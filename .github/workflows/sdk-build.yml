name: Luckfox SDK Build

on:
  workflow_dispatch:
  # Reusable: release.yml calls this with a version string so the produced
  # artifact can be picked up and attached to the GitHub Release.
  workflow_call:
    inputs:
      version:
        description: "Version tag passed in by the caller (e.g. v0.1.0)"
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the uploaded firmware artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ubuntu-22.04
    # 180 min, not 120: v0.2.0's run hit the 120 ceiling at exactly
    # 2h00m (sdk-build itself finished all steps; the kill came at the
    # job-level timeout). Earlier successful runs ran ~1h45m, so 120
    # left only a 15 min cushion -- one bad shared-runner allocation
    # and we overrun. 180 covers normal jitter without raising actual
    # cost: GitHub bills on elapsed time, not the timeout ceiling.
    timeout-minutes: 180
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ---- Free up disk space on the runner ----
      - name: Free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      # ---- Checkout this repository ----
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # ---- Install SDK build dependencies ----
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ssh make gcc gcc-multilib g++-multilib \
            module-assistant expect g++ gawk texinfo libssl-dev bison flex \
            fakeroot cmake unzip gperf autoconf device-tree-compiler \
            libncurses5-dev pkg-config bc python-is-python3 passwd openssl \
            openssh-server openssh-client vim file cpio rsync curl \
            android-tools-adb python3-pip python3-venv \
            sudo locales
          sudo locale-gen en_US.UTF-8

      # ---- Shallow clone Luckfox SDK ----
      - name: Clone Luckfox SDK
        run: |
          git clone --depth 1 https://github.com/LuckfoxTECH/luckfox-pico.git

      # ---- Patch kernel defconfig to enable USB CDC NCM gadget ----
      # NCM lets macOS / Win10 1903+ / Linux recognize the device as a
      # USB Ethernet adapter with zero driver install. Idempotent: re-running
      # the workflow without losing this patch.
      - name: Enable USB CDC NCM in kernel defconfig
        working-directory: luckfox-pico
        run: |
          DEF=sysdrv/source/kernel/arch/arm/configs/luckfox_rv1106_linux_defconfig
          if grep -q "^CONFIG_USB_CONFIGFS_NCM=" "$DEF"; then
            echo "NCM already enabled in defconfig"
          else
            sed -i '/^CONFIG_USB_CONFIGFS_RNDIS=y/a CONFIG_USB_CONFIGFS_NCM=y' "$DEF"
          fi
          echo "--- USB CONFIGFS settings after patch ---"
          grep "^CONFIG_USB_CONFIGFS" "$DEF"

      # ---- Register the rootfs post-build hook ----
      # Drops scripts/buildroot_post_build.sh into Buildroot's
      # BR2_ROOTFS_POST_BUILD_SCRIPT slot so /etc/ai_hud_db_secret
      # lands in the image.
      #
      # We patch the *source* defconfigs under sysdrv/tools/board/buildroot/
      # rather than the post-extract copies under sysdrv/source/buildroot/
      # buildroot-2023.02.6/configs/. The Luckfox sysdrv Makefile ships
      # Buildroot as a tarball and only extracts + cp's the defconfigs into
      # configs/ on the first `./build.sh` invocation. Patching at the cp
      # source lets build.sh pick the change up naturally without us having
      # to fork the SDK's prepare flow.
      - name: Register Buildroot post-build hook
        run: |
          set -eu
          HOOK_SRC="$GITHUB_WORKSPACE/scripts/buildroot_post_build.sh"
          chmod +x "$HOOK_SRC"

          # All luckfox*_defconfig files the SDK cp's into Buildroot's
          # configs/ tree -- patch every one so any board choice gets the
          # hook (Pico Ultra uses luckfox_pico_w_defconfig per its
          # BoardConfig-EMMC-Buildroot-RV1106_Luckfox_Pico_Ultra-IPC.mk).
          SRC_DIR=luckfox-pico/sysdrv/tools/board/buildroot
          DEFCONFIGS=$(find "$SRC_DIR" -maxdepth 1 -name 'luckfox*_defconfig')
          N=$(echo "$DEFCONFIGS" | grep -c .)
          if [ "$N" -eq 0 ]; then
              echo "::error::No luckfox*_defconfig found under $SRC_DIR"
              ls "$SRC_DIR" || true
              exit 1
          fi
          echo "--- Defconfigs to patch ($N) ---"
          echo "$DEFCONFIGS"

          # Idempotent per file: replace existing setting; append if absent.
          # Absolute HOOK_SRC so Buildroot finds the script regardless of
          # which CWD it execs from internally.
          for DEFCONFIG in $DEFCONFIGS; do
              if grep -q "^BR2_ROOTFS_POST_BUILD_SCRIPT" "$DEFCONFIG"; then
                  sed -i "s|^BR2_ROOTFS_POST_BUILD_SCRIPT=.*|BR2_ROOTFS_POST_BUILD_SCRIPT=\"$HOOK_SRC\"|" "$DEFCONFIG"
              else
                  echo "BR2_ROOTFS_POST_BUILD_SCRIPT=\"$HOOK_SRC\"" >> "$DEFCONFIG"
              fi
              echo "  $DEFCONFIG -> $(grep "^BR2_ROOTFS_POST_BUILD_SCRIPT" "$DEFCONFIG")"
          done

      # ---- Fail fast if the secret isn't actually plumbed through ----
      # The Build SDK step takes ~1h45m; we'd rather discover a missing
      # AI_HUD_DB_SECRET in 5 seconds than 105 minutes. Common causes:
      #   * Secret not configured at repo level (Settings -> Secrets)
      #   * Reusable workflow called without `secrets: inherit` -- the
      #     v0.3.0 release failure root cause; sdk-build.yml can't see
      #     caller secrets unless the caller forwards them explicitly
      - name: Verify AI_HUD_DB_SECRET reached the runner
        env:
          AI_HUD_DB_SECRET: ${{ secrets.AI_HUD_DB_SECRET }}
        run: |
          if [ -z "${AI_HUD_DB_SECRET:-}" ]; then
              echo "::error::AI_HUD_DB_SECRET is empty. Configure it at repo"
              echo "::error::Settings -> Secrets and ensure callers of this"
              echo "::error::reusable workflow specify 'secrets: inherit'."
              exit 1
          fi
          echo "Secret reached the runner (${#AI_HUD_DB_SECRET} bytes)"

      # ---- Build the SDK (RV1106G3 + Buildroot) ----
      - name: Build SDK
        working-directory: luckfox-pico
        env:
          # Buildroot passes its full environment to post-build scripts,
          # so this single env var reaches scripts/buildroot_post_build.sh
          # which writes /etc/ai_hud_db_secret into the rootfs.
          AI_HUD_DB_SECRET: ${{ secrets.AI_HUD_DB_SECRET }}
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          chmod +x build.sh
          # Non-interactive lunch: "5" = Pico Ultra, "0" = EMMC, "0" = Buildroot
          printf '5\n0\n0\n' | ./build.sh lunch
          ./build.sh
          # Sanity check -- the post-build hook should have left a
          # 0600 secret file in the staged rootfs. If this is missing
          # the firmware will boot but every signed DB will be rejected.
          #
          # Use `find` with a name match plus a loose */output/target/etc
          # path filter rather than a hard-coded versioned glob. The old
          # pattern "*/buildroot/output/target/etc/..." missed the real
          # path (.../buildroot/buildroot-2023.02.6/output/...) so every
          # run reported a false miss even when the hook ran successfully
          # and wrote the file.
          STAGED=$(find . -path '*/output/target/etc/ai_hud_db_secret' \
                          -name ai_hud_db_secret -print -quit)
          if [ -z "$STAGED" ] || [ ! -f "$STAGED" ]; then
              echo "::error::/etc/ai_hud_db_secret missing in staged rootfs"
              echo "--- buildroot output/target/etc contents ---"
              find . -path '*/output/target/etc' -type d \
                    -exec sh -c 'echo "[in $1]"; ls -la "$1" 2>/dev/null | head -20' _ {} \;
              exit 1
          fi
          echo "Secret staged: $STAGED ($(stat -c%a "$STAGED") mode, $(wc -c <"$STAGED") bytes)"

      # ---- Compute artifact name (versioned when called from release.yml) ----
      - name: Compute artifact name
        id: set-artifact-name
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "name=luckfox-firmware-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=luckfox-firmware" >> "$GITHUB_OUTPUT"
          fi

      # ---- Upload firmware artifacts ----
      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: luckfox-pico/output/image/
          retention-days: 7
