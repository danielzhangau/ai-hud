name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the SDK via the reusable sdk-build workflow, generates a changelog
# from conventional commits with git-cliff, then publishes a GitHub Release
# carrying the firmware artifacts.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # action-gh-release needs to create releases + upload assets.
  contents: write

# Serialize releases for the same tag -- protects against accidental
# double-pushes and race conditions on the artifact name.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build firmware via the reusable sdk-build workflow
  # ---------------------------------------------------------------------------
  build:
    uses: ./.github/workflows/sdk-build.yml
    with:
      version: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # 2. Generate changelog + publish GitHub Release with firmware attached
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      # Full history required so git-cliff can walk from the previous tag.
      # Actions are pinned to commit SHA (supply-chain hardening). Comments
      # carry the human-readable tag so dependabot can still rotate them.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      # Generate the per-tag changelog body. --latest emits only the section
      # for the newly pushed tag (everything between the prior tag and HEAD).
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Pull the firmware images produced by the build job.
      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: firmware

      # Stage the speed databases alongside firmware so a single release
      # bundles everything an operator needs to bring a device up to a
      # known-good state without re-running the full SDK build locally.
      - name: Stage speed databases
        run: |
          mkdir -p firmware/data
          cp data/speed_zones.db    firmware/data/ 2>/dev/null || true
          cp data/speed_cameras.db  firmware/data/ 2>/dev/null || true
          cp data/speed_zones_cn.db firmware/data/ 2>/dev/null || true
          cp data/speed_cameras_cn.db firmware/data/ 2>/dev/null || true
          ls -la firmware/data/ || true

      # Add SHA-256 checksums so users can verify downloads.
      - name: Compute checksums
        working-directory: firmware
        run: |
          # `find` (not glob) so the loop is silent when an extension has zero
          # matches; -print0 / -0 keeps spaces-in-names safe; redirect once.
          # Includes *.db so the speed database checksums ship in the same
          # SHA256SUMS file as the firmware images.
          find . -maxdepth 2 -type f \( -name "*.img" -o -name "*.bin" -o -name "*.db" \) \
            -print0 | xargs -0 -r sha256sum > SHA256SUMS
          echo "--- release bundle ---"
          ls -la
          ls -la data/ 2>/dev/null || true
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          test -s SHA256SUMS || { echo "ERROR: no firmware images found"; exit 1; }

      # Publish the GitHub Release. The action creates the release if missing
      # or updates it (additive on assets) if the tag already has one.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI-HUD ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          # Prerelease for any 0.x or any tag containing a hyphen (e.g. v0.2.0-rc1).
          # GitHub conveniently lets us pass a literal boolean expression here.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          files: |
            firmware/*.img
            firmware/data/*.db
            firmware/SHA256SUMS
          # Fail the workflow if firmware/*.img isn't present so we never
          # ship an empty release. The .db glob is forgiving on its own --
          # action-gh-release treats an unmatched glob as a warning -- so
          # missing speed databases won't abort a release on their own.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
