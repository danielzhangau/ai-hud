name: App Build

on:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Download standalone cross-compilation toolchain ----
      - name: Download toolchain
        run: |
          git clone --depth 1 https://github.com/deerpi/arm-rockchip830-linux-uclibcgnueabihf.git /opt/toolchain
          echo "Toolchain installed at /opt/toolchain"
          ls /opt/toolchain/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc

      # ---- Download RKMPI headers and pre-built libraries ----
      - name: Download RKMPI headers and libraries
        run: |
          git clone --depth 1 https://github.com/LuckfoxTECH/luckfox_pico_rkmpi_example.git /opt/rkmpi
          echo "=== RKMPI headers ==="
          ls /opt/rkmpi/include/rk_mpi_*.h | head -5
          echo "=== RKMPI uclibc libs ==="
          ls /opt/rkmpi/lib/uclibc/lib*.so | head -5

      # ---- Build the application (production: 9-class speed signs) ----
      - name: Build (production)
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/rv1106-toolchain.cmake \
            -DTOOLCHAIN_DIR=/opt/toolchain \
            -DRKMPI_DIR=/opt/rkmpi
          make -j$(nproc) VERBOSE=1

      # ---- Build COCO test variant (80-class for NPU pipeline testing) ----
      - name: Build (COCO test)
        run: |
          mkdir -p build-coco && cd build-coco
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/rv1106-toolchain.cmake \
            -DTOOLCHAIN_DIR=/opt/toolchain \
            -DRKMPI_DIR=/opt/rkmpi \
            -DCOCO_TEST=ON
          make -j$(nproc)

      # ---- Strip and show binary info ----
      - name: Strip binaries
        run: |
          STRIP=/opt/toolchain/bin/arm-rockchip830-linux-uclibcgnueabihf-strip
          $STRIP build/ai-hud
          $STRIP build-coco/ai-hud
          echo "=== Production build ==="
          file build/ai-hud
          ls -lh build/ai-hud
          echo "=== COCO test build ==="
          file build-coco/ai-hud
          ls -lh build-coco/ai-hud

      # ---- Upload compiled binaries ----
      - name: Upload production binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-hud-rv1106
          path: build/ai-hud
          retention-days: 30

      - name: Upload COCO test binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-hud-rv1106-coco-test
          path: build-coco/ai-hud
          retention-days: 30
