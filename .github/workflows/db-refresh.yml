name: Speed DB Refresh

# Rebuilds data/speed_zones*.db and data/speed_cameras*.db from upstream
# OpenStreetMap data on a monthly cadence. Output is committed via an
# auto-PR so a human can eyeball the size/zone-count diff before merging.
#
# Why a PR (not a direct commit to main):
#  - OSM occasionally ships vandalism / drastic edits (a residential
#    street briefly tagged maxspeed=300, etc.). A PR review catches that.
#  - The diff stats in the PR body make regressions obvious -- if the AU
#    zone count drops by 30k between months something is very wrong.

on:
  schedule:
    # 1st of every month, 03:00 UTC. Off-peak for OSM Overpass and
    # GitHub Actions queues.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write       # commit the regenerated .db files
  pull-requests: write  # open the auto-PR

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        run: python3 -V

      - name: Install builder deps
        run: pip install pyyaml

      - name: Snapshot pre-build sizes (for diff)
        id: pre
        run: |
          {
            echo "au_zones=$(stat -c%s data/speed_zones.db 2>/dev/null || echo 0)"
            echo "cn_zones=$(stat -c%s data/speed_zones_cn.db 2>/dev/null || echo 0)"
            echo "au_cams=$(stat -c%s data/speed_cameras.db 2>/dev/null || echo 0)"
            echo "cn_cams=$(stat -c%s data/speed_cameras_cn.db 2>/dev/null || echo 0)"
          } >> "$GITHUB_OUTPUT"

      # Stash the previous-merged AU build artefacts so the health scorer
      # later in this job can compare against them. We resolve them from
      # the on-disk file (which is what we just snapshotted sizes for) and
      # from the JSON summary stored alongside under data/quarantine/.
      - name: Stash previous-build artefacts for delta comparison
        id: baseline
        run: |
          mkdir -p /tmp/baseline
          # Copy the .db file as-is so db_health can read its header.
          cp data/speed_zones.db /tmp/baseline/old_speed_zones.db 2>/dev/null || true
          # The summary JSON name has a date in it; just take the newest.
          # This is best-effort -- a fresh repo without prior summary
          # will get treated as "no baseline" by db_health.
          PREV_JSON=$(ls -t data/quarantine/au_summary_*.json 2>/dev/null | head -1)
          if [ -n "$PREV_JSON" ] && [ -f "$PREV_JSON" ]; then
              cp "$PREV_JSON" /tmp/baseline/old_summary.json
              echo "old_summary=/tmp/baseline/old_summary.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/baseline/old_speed_zones.db ]; then
              echo "old_db=/tmp/baseline/old_speed_zones.db" >> "$GITHUB_OUTPUT"
          fi

      # AU uses the new build_db.py pipeline (state fetchers + OSM
      # cross-verify -> v3 binary). The quarantine report it writes is
      # surfaced in the PR body below. CN continues on the legacy
      # prepare_speed_db.py path until a dedicated CN fetcher chain
      # exists -- the two pipelines write disjoint .db files so they
      # never step on each other.
      - name: Rebuild AU databases (new pipeline)
        env:
          # Builder uses this to write HMAC-SHA256 .sig sidecars next
          # to each .db. Must match the secret baked into rootfs at
          # /etc/ai_hud_db_secret -- key rotation requires both.
          AI_HUD_DB_SECRET: ${{ secrets.AI_HUD_DB_SECRET }}
          # Force unbuffered stdout so we see per-fetcher progress in
          # the CI log live. Without this, build_db's print() output
          # only flushes on process exit -- if the job is cancelled or
          # OOM-killed mid-run we get zero visibility into where it
          # got stuck. Lost ~15 minutes on this in the first attempt.
          PYTHONUNBUFFERED: "1"
        run: python3 -u tools/build_db.py --region au

      - name: Rebuild CN databases (legacy OSM-only)
        env:
          AI_HUD_DB_SECRET: ${{ secrets.AI_HUD_DB_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u tools/prepare_speed_db.py --region cn

      - name: Compute diff stats
        id: diff
        run: |
          # Returns "delta" in bytes between pre and post sizes for each db.
          # Used to populate the PR body so a reviewer can sanity-check the
          # change at a glance instead of opening four binary files.
          delta() {
              local pre="$1" path="$2"
              local post; post=$(stat -c%s "$path" 2>/dev/null || echo 0)
              local d=$((post - pre))
              local sign="+"
              [ "$d" -lt 0 ] && sign=""
              echo "${sign}${d}"
          }
          {
              echo "AU zones:   ${{ steps.pre.outputs.au_zones }} -> $(stat -c%s data/speed_zones.db) bytes ($(delta ${{ steps.pre.outputs.au_zones }} data/speed_zones.db))"
              echo "AU cameras: ${{ steps.pre.outputs.au_cams }} -> $(stat -c%s data/speed_cameras.db) bytes ($(delta ${{ steps.pre.outputs.au_cams }} data/speed_cameras.db))"
              echo "CN zones:   ${{ steps.pre.outputs.cn_zones }} -> $(stat -c%s data/speed_zones_cn.db) bytes ($(delta ${{ steps.pre.outputs.cn_zones }} data/speed_zones_cn.db))"
              echo "CN cameras: ${{ steps.pre.outputs.cn_cams }} -> $(stat -c%s data/speed_cameras_cn.db) bytes ($(delta ${{ steps.pre.outputs.cn_cams }} data/speed_cameras_cn.db))"
          } | tee diff.txt
          # Locate the AU build report written by build_db.py. The
          # filename embeds today's date so we glob.
          AU_REPORT=$(ls data/quarantine/au_summary_*.md 2>/dev/null | head -1)
          {
              echo 'body<<EOF'
              echo '## Monthly speed database refresh'
              echo
              echo 'Auto-generated by `.github/workflows/db-refresh.yml`. Compare the diff stats below against last month: a single-region delta over ~20% probably indicates an upstream data anomaly worth investigating before merge.'
              echo
              echo '### Size delta'
              echo '```'
              cat diff.txt
              echo '```'
              echo
              if [ -n "$AU_REPORT" ] && [ -f "$AU_REPORT" ]; then
                  echo '### AU cross-verification report'
                  cat "$AU_REPORT"
                  echo
              fi
              echo '### Source'
              echo "- AU: rebuilt via \`tools/build_db.py\` on $(date -u +'%Y-%m-%d %H:%M UTC')"
              echo "  - Fetchers: NSW + VIC + QLD + WA + ACT (official) + OSM (cross-verify)"
              echo "  - Output: v3 binary with per-record source_mask + confidence"
              echo "- CN: rebuilt via legacy \`tools/prepare_speed_db.py\` (OSM-only, v2)"
              echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Score the candidate against the stashed baseline. Always
      # writes /tmp/health.json with the verdict + supporting numbers
      # so the next step can read it deterministically.
      - name: Score auto-merge eligibility
        id: health
        run: |
          NEW_JSON=$(ls -t data/quarantine/au_summary_*.json 2>/dev/null | head -1)
          python3 tools/db_health.py \
              ${{ steps.baseline.outputs.old_db && format('--old-db {0}', steps.baseline.outputs.old_db) || '' }} \
              ${{ steps.baseline.outputs.old_summary && format('--old-summary {0}', steps.baseline.outputs.old_summary) || '' }} \
              --new-db data/speed_zones.db \
              --new-summary "$NEW_JSON" \
              --output /tmp/health.json
          # Surface the bool and the human-readable reason both as step
          # outputs so the PR step can label conditionally and the merge
          # step can guard on safe_to_automerge alone.
          SAFE=$(python3 -c "import json; print('true' if json.load(open('/tmp/health.json'))['safe_to_automerge'] else 'false')")
          REASON=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['reason'])")
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Auto-merge eligibility: $SAFE ($REASON)"

      # Extend the PR body with the auto-merge verdict so a reviewer
      # who DOES open the PR (e.g. when safe=false) can see why.
      - name: Append health verdict to PR body
        id: body
        run: |
          ORIGINAL_BODY=$(cat <<'EOF'
          ${{ steps.diff.outputs.body }}
          EOF
          )
          {
              echo 'body<<PRBODY'
              echo "$ORIGINAL_BODY"
              echo
              echo '### Auto-merge verdict'
              echo '```json'
              cat /tmp/health.json
              echo '```'
              if [ "${{ steps.health.outputs.safe }}" = "true" ]; then
                  echo
                  echo '> _Auto-merge enabled. Will land once required checks pass._'
              else
                  echo
                  echo '> **Human review required**: ${{ steps.health.outputs.reason }}'
              fi
              echo 'PRBODY'
          } >> "$GITHUB_OUTPUT"

      - name: Open / update PR
        id: pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6
        with:
          commit-message: "data: monthly OSM refresh"
          title: "data: monthly OSM refresh"
          body: ${{ steps.body.outputs.body }}
          branch: ci/db-refresh
          delete-branch: true
          add-paths: |
            data/*.db
            data/*.db.sig
            data/quarantine/*.md
            data/quarantine/*.jsonl
            data/quarantine/*.json
          # The auto-merge step downstream guards on safe=true; the
          # label is informational so a human scrolling the PR list
          # can see at a glance which months auto-shipped vs needed
          # attention.
          labels: |
            data
            ci
            ${{ steps.health.outputs.safe == 'true' && 'auto-merge' || 'needs-review' }}

      # Enable PR auto-merge so the bot drops the change in as soon as
      # required checks (if any) pass. We only flip the switch when the
      # health scorer cleared the change -- a "needs-review" PR sits
      # untouched until a human merges it.
      #
      # Note: GitHub's "Allow auto-merge" must be enabled in the repo
      # settings (Settings > General > Pull Requests). If it isn't, this
      # step prints a warning instead of failing -- the PR is still
      # there, just no auto-merge attached.
      - name: Enable auto-merge when safe
        if: steps.pr.outputs.pull-request-number && steps.health.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.pull-request-number }}"
          echo "Attempting --auto merge on PR #$PR_NUM"
          if ! gh pr merge "$PR_NUM" --auto --squash; then
              echo "::warning::auto-merge could not be enabled -- check that "\
                   "'Allow auto-merge' is on in repo Settings > General"
          fi
