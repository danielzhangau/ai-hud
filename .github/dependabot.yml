# Auto-rotate GitHub Actions that we've SHA-pinned for supply-chain safety.
# Without this file, pins would freeze forever and we'd miss CVE fixes.
# Dependabot reads the human-readable comment (e.g. `# v4`) next to each SHA
# and only opens a PR when there's a newer release of the action.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # Roll all GitHub Actions updates into a single weekly PR. Without
    # this, a Node-runtime bump (e.g. Node 20 -> Node 24) tends to
    # cascade across every action and produce 5+ near-identical PRs
    # that all need the same review attention. Grouping keeps reviews
    # in one place; if the grouped PR breaks CI, the failure mode is
    # almost always "runner doesn't support the new Node version yet"
    # which is the same root cause for all the actions.
    groups:
      github-actions:
        patterns:
          - "*"
