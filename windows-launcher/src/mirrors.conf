# Optional mirror base URLs for AI-HUD update bundles.
#
# Each non-empty, non-comment line is a fully-qualified base URL where
# update-bundle-vX.Y.Z.zip files can be found. The launcher tries GitHub
# Releases first, then walks this list in order. Useful for users behind
# unreliable github.com access (e.g. mainland China).
#
# Example (uncomment and adjust):
# https://gitee.com/danielzhangau/ai-hud-bundles/raw/main
# https://ai-hud-bundles.oss-cn-shanghai.aliyuncs.com
